[project]
name = "hydris-risk-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pandas==3.0.1", "geopandas==1.2.0", "pyogrio==0.13.0", "shapely==2.1.2", "pyarrow==25.0.1",
  "pydantic==2.13.4", "pyyaml==6.0.3", "typer==0.20.0", "streamlit==1.65.0", "plotly==7.1.0", "pydeck==0.9.3",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "ruff==0.15.12"]
e2e = ["playwright==1.63.0"]
api = ["fastapi", "uvicorn"]

[tool.setuptools.packages.find]
include = ["hydris_risk*"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not e2e\""   # browser tests run only with: pytest -m e2e
markers = ["e2e: browser tests (Playwright + Chromium); excluded by default"]
