[project]
name = "hydris-risk-engine"
version = "0.1.0"
requires-python = ">=3.11"
# Core: the risk engine (hydris_risk) only.
dependencies = [
  "pandas==3.0.1", "geopandas==1.2.0", "pyogrio==0.13.0", "shapely==2.1.2", "pyarrow==25.0.1",
  "pydantic==2.13.4", "pyyaml==6.0.3",
]

[project.optional-dependencies]
report = ["reportlab==5.0.0", "matplotlib==3.10.8", "jinja2==3.1.6"]          # hydris_report
cli = ["typer==0.20.0", "hydris-risk-engine[report]"]                          # hydris_cli (runs the risk and report engines)
web = ["streamlit==1.65.0", "plotly==7.1.0", "pydeck==0.9.3", "hydris-risk-engine[report]"]  # web/
all = ["hydris-risk-engine[report,cli,web]"]
dev = ["pytest==9.0.3", "ruff==0.15.12", "pypdf==6.19.0", "pypdfium2==5.14.0"]
e2e = ["playwright==1.63.0"]
api = ["fastapi", "uvicorn"]

[project.scripts]
hydris = "hydris_cli.main:app"

[tool.setuptools.packages.find]
include = ["hydris_risk*", "hydris_report*", "hydris_cli*"]

[tool.setuptools.package-data]
hydris_report = ["templates/*.j2", "assets/fonts/*"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not e2e\""   # browser tests run only with: pytest -m e2e
markers = ["e2e: browser tests (Playwright + Chromium); excluded by default"]
